# SPDX-License-Identifier: GPL-3.0-or-later
#
# builds mbelib-neo and the plugin with warnings as errors, runs make check
# (the plugin loaded as tcd does it), on Linux with gcc also under ASan, and
# compares CodecPlugin.h with tcd's in urfd-ng
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc, cxx: g++, asan: true }
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: macos-latest, cc: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            mbelib-neo-*/install
            mbelib-neo-*/src/src/internal
            mbelib-neo-*/src/CMakeLists.txt
          key: mbelib-neo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-mbelib-neo.sh') }}

      - name: mbelib-neo
        run: ./build-mbelib-neo.sh

      - name: make check
        run: make WERROR=1 CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} check

      - name: only tcd_codec_plugin is exported
        if: runner.os == 'Linux'
        run: |
          nm -D --defined-only mbelib_neo_codec.so
          [ "$(nm -D --defined-only mbelib_neo_codec.so | awk '{ print $3 }')" = tcd_codec_plugin ]

      - name: make check under ASan
        if: matrix.asan
        run: |
          make clean
          make WERROR=1 CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" CXXFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined" check

  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CodecPlugin.h is tcd's
        run: |
          curl -fsSL -o /tmp/CodecPlugin.h https://raw.githubusercontent.com/jcmerg/urfd-ng/main/tcd/CodecPlugin.h
          diff -u /tmp/CodecPlugin.h CodecPlugin.h
